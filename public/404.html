<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not here — Mihir Bellamkonda</title>
<meta name="description" content="That page is not on this site.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--
  Served by GitHub Pages for any unmatched path, including poems that have
  been withdrawn. Deliberately standalone: no Vue, no bundle, absolute asset
  paths only, because it renders at URLs that do not otherwise exist.
-->
<style>
  @font-face {
    font-family: 'Sorts Mill Goudy';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/sorts-mill-goudy-400-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Sligoil Micro';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/sligoil-micro-400-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Spectral';
    font-style: normal;
    font-weight: 300;
    font-display: swap;
    src: url('/fonts/spectral-300-latin.woff2') format('woff2');
  }

  :root {
    --a-bg:    #F2EFE6;
    --a-ink:   #23211C;
    --a-ink-2: #6A665C;
    --a-faint: #A5A093;
    --a-hair:  #D5D0C2;
    --accent:  #1F4A34;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --a-bg:    #1B1A16;
      --a-ink:   #E6E2D6;
      --a-ink-2: #A5A093;
      --a-faint: #726E64;
      --a-hair:  #33302A;
      --accent:  #6FA98A;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--a-bg);
    color: var(--a-ink);
    font-family: 'Spectral', 'Iowan Old Style', Georgia, serif;
    font-weight: 300;
    font-size: 17px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .inner {
    flex: 1;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 clamp(1.25rem, 5vw, 4.5rem);
  }

  .chrome {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1.5rem;
    padding: clamp(1.4rem, 4vw, 2.4rem) 0 0;
    font-family: 'Sligoil Micro', ui-monospace, Menlo, monospace;
    font-size: 0.63rem;
    letter-spacing: 0.18em;
    color: var(--a-faint);
  }

  .chrome a { color: var(--a-faint); text-decoration: none; border-bottom: 1px solid transparent; }
  .chrome a:hover { color: var(--a-ink); border-bottom-color: var(--a-hair); }

  main {
    padding: clamp(6rem, 26vh, 15rem) 0 0;
    max-width: 42rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  h1 {
    font-family: 'Sorts Mill Goudy', 'Hoefler Text', Garamond, Georgia, serif;
    font-weight: 300;
    font-size: clamp(2.6rem, 7vw, 4.4rem);
    line-height: 1;
    text-wrap: balance;
  }

  p { max-width: 46ch; color: var(--a-ink-2); }

  .ways {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    font-family: 'Sligoil Micro', ui-monospace, Menlo, monospace;
    font-size: 0.63rem;
    letter-spacing: 0.18em;
  }

  .ways a {
    color: var(--a-ink);
    text-decoration: none;
    border-bottom: 1px solid var(--a-hair);
    padding-bottom: 0.2rem;
  }

  .ways a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .ways a:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

  .rest { height: clamp(6rem, 22vh, 14rem); }
</style>
</head>
<body>
  <div class="inner">
    <div class="chrome">
      <a href="/">mihirbellamkonda.com</a>
      <a href="/#index">index</a>
    </div>

    <main>
      <h1>Not here</h1>
      <p>
        This address doesn’t point at anything — either it was mistyped, or the poem
        that lived here has been withdrawn.
      </p>
      <p class="ways">
        <a href="/#index">read the index →</a>
        <a href="/">about →</a>
      </p>
    </main>

    <div class="rest"></div>
  </div>
</body>
</html>
