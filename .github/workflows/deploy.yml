name: Deploy to GitHub Pages

on:
  push:
    branches:
      - trunk  # Triggers on push to trunk branch
  workflow_dispatch:  # Allows manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and verify site
        run: npm run verify

      - name: Install browser for release checks
        run: npx playwright install --with-deps chromium

      - name: Check desktop, phone, navigation, and title writing
        run: npm run test:browser

      - name: Stamp verified release
        run: node scripts/write-release.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm the expected release is live
        run: npm run check:release
        env:
          SITE_URL: https://mihirbellamkonda.com

      - name: Check the published site in desktop and phone browsers
        run: npm run test:browser
        env:
          SITE_URL: https://mihirbellamkonda.com

      - name: Check publisher links
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        run: npm run check:links

      - name: Keep browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 14
